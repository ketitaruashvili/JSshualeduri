<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products Page</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #ffffff;
        margin: 0;
        padding: 24px 40px 60px;
      }
      .products-wrapper {
        max-width: 1024px;
        width: 100%;
        margin: auto;
        min-height: 400px;
      }
      .search-value {
        width: 100%;
        max-width: 600px;
        margin: 0 auto 32px;
        padding: 14px 20px;
        border: 1px solid #ddd;
        border-radius: 12px;
        outline: none;
        font-size: 15px;
      }
      .products {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        margin-top: 20px;
      }
      .products-list {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 16px;
      }
      .cart-summary {
        width: 220px;
        min-height: 140px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        position: sticky;
        top: 28px;
      }
      .cart-summary .total-price {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 12px;
      }
      .checkout-btn {
        width: 100%;
        border: none;
        background-color: rgb(5, 128, 5);
        color: #fff;
        font-size: 16px;
        height: 44px;
        border-radius: 8px;
        cursor: pointer;
      }
      .card {
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 12px;
        display: flex;
        flex-direction: column;
      }
      .thumbnail {
        width: 100%;
        height: 110px;
        object-fit: contain;
        margin-bottom: 10px;
      }
      .product-info h3 {
        margin: 0 0 6px 0;
        font-size: 14px;
      }
      .product-info .description {
        font-size: 12px;
        color: #666;
        margin: 0 0 8px 0;
        min-height: 48px;
      }
      .product-info .price {
        font-size: 14px;
        font-weight: bold;
        margin: 0 0 6px 0;
      }
      .product-info .meta {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #444;
        margin-bottom: 10px;
      }
      .quantity-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: auto;
      }
      .quantity-controls button {
        width: 24px;
        height: 24px;
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
      }
      .quantity-controls button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .no-results {
        text-align: center;
        color: #777;
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <section class="products-wrapper">
      <input
        type="text"
        placeholder="Search products..."
        class="search-value"
      />
      <div class="products">
        <div class="products-list"></div>
        <div class="cart-summary">
          <div class="total-price">Total Price: 0 GEL</div>
          <button class="checkout-btn">Pay</button>
        </div>
      </div>
    </section>
    <script src="./index.js"></script>
  </body>
</html>
